# Run the public tunmap server with one command.
#
#   BASE_DOMAIN=example.com docker compose up -d
#   # optional shared key: AUTH_KEY=mysecret docker compose up -d
#
# Point a wildcard DNS record *.example.com at this server, then:
#   - any client: tunmap-client --server http://example.com:8080 --port 5050
#   - share http://<random>.example.com:8080 with anyone.
services:
  tunmap-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      - TUNMAP_ADDR=:8080
      - TUNMAP_BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - TUNMAP_AUTH_KEY=${AUTH_KEY:-}
    restart: unless-stopped
